[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsgym"
version = "0.1.0"
description = "A small, deterministic RL environment for enterprise operations agents"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
opsgym = "opsgym.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

